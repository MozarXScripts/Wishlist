name: Build IPA

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build IPA
        run: bash build_ipa.sh
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Wishlist-ipa
          path: Wishlist.ipa
